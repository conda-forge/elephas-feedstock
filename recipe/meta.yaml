{% set name = "elephas" %}
{% set version = "7.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ed7033b910bd1c455c65c93af2e0970c6d83820bef40db428bb77b93b6d166e4

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling
    - python {{ python_min }}
  run:
    - cython ==0.29.33
    - flask ==2.3.3
    - h5py ==3.11.0
    - numpy <2.0.0
    - pyspark <=4.0.0
    - tensorflow >2.2,<2.20
    - python >={{ python_min }},<3.13

test:
  requires:
    - python {{ python_min }}
  imports:
    - elephas
    - elephas.enums
    - elephas.ml
    - elephas.mllib
    - elephas.parameter
    - elephas.utils

about:
  home: https://danielenricocahall.github.io/elephas/
  license: MIT
  license_file: LICENSE
  summary: Distributed deep learning on Spark with Keras
  dev_url: https://github.com/danielenricocahall/elephas

extra:
  recipe-maintainers:
    - oblute
    - rluria14
    - mxr-conda
